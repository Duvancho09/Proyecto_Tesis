<navbar/>
<div class="cart-container container py-5">
  <h2 class="text-white mb-5 text-center">Tu Carrito Digital</h2>
  <div class="row justify-content-center">
    <ng-container *ngIf="items.length > 0">
      <div class="col-lg-8">
        <div class="cart-item-card mb-3" *ngFor="let item of items">
          <div class="d-flex align-items-center p-3">
            <img [src]="item.url" class="img-miniature rounded" alt="NFT">
            
            <div class="ms-3 flex-grow-1">
              <h5 class="text-white mb-0">{{ item.name }}</h5>
              
              <!-- Controles de cantidad estilo Temu -->
              <div class="d-flex align-items-center mt-2">
                <button class="btn-qty" (click)="cambiarCantidad(item, -1)">-</button>
                <span class="mx-3 text-info fw-bold">{{ item.cantidad }}</span>
                <button class="btn-qty" (click)="cambiarCantidad(item, 1)">+</button>
              </div>

              <!-- El precio se multiplica automáticamente -->
              <p class="price-mini mt-1 mb-0">{{ (item.price * item.cantidad) | number }}</p>
            </div>

            <button class="btn-delete" (click)="eliminar(item)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="summary-card p-4">
          <h4 class="text-white mb-3">Resumen</h4>
          <div class="d-flex justify-content-between text-white-50">
            <span>Subtotal:</span>
            <span>{{ totalCompra | number }}</span>
          </div>
          <hr class="text-secondary">
          <div class="d-flex justify-content-between text-white fw-bold fs-5">
            <span>Total:</span>
            <span class="text-info">{{ totalCompra | number }}</span>
          </div>
          <button class="btn-checkout w-100 mt-4">Pagar con Wallet</button>
        </div>
      </div>
    </ng-container>

    <div *ngIf="items.length === 0" class="col-12 text-center mt-5 v-center">
      <div class="empty-cart-box p-5">
        <h3 class="text-white-50">Tu carrito está vacío</h3>
        <p class="text-light opacity-75">¡Añade algunos NFTs para empezar!</p>
        <a routerLink="/collections" class="btn btn-info mt-3 px-4 shadow-sm">Explorar Obras</a>
      </div>
    </div>
  </div>
</div>
<sidenav/>
